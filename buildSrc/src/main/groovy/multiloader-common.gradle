// Shared by common, neoforge and fabric (after the MultiLoader template by jaredlll08)
plugins {
    id 'java-library'
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"

base {
    archivesName = project.name == 'common' ? 'Rampart-common' : "Rampart-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    // compatibility checks with other mods (-Pwith_compat), dev runs only
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // javax.annotation.Nullable (Minecraft ships it at runtime, Loom doesn't put it on the classpath)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_rampart' } }
    from(rootProject.file('licenses')) { into 'licenses/rampart' }
}

processResources {
    var expandProps = [
            'version'                : version,
            'mod_version'            : mod_version,
            'mod_description'        : mod_description,
            'mod_sources'            : mod_sources,
            'mod_issues'             : mod_issues,
            'minecraft_version'      : minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'neo_version_range'      : neo_version_range,
            'fabric_loader_version'  : fabric_loader_version,
            'mod_name'               : mod_name,
            'mod_id'                 : mod_id,
            'license'                : license,
            'java_version'           : java_version,
    ]
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

// ./gradlew publishToMavenLocal: the mods that use Rampart build against dev.vladeezyy:rampart-<common|neoforge|fabric>
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "rampart-${project.name}"
            from components.java
        }
    }
}
